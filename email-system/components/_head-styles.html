<!--
  Nootropix Email Design System — shared <head> styles
  Paste inside <head> after meta tags. Do not duplicate in campaigns.
-->
<style type="text/css">
  @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap');
  html, body { margin:0 !important; padding:0 !important; width:100% !important; }
  body { background:#ECEDE9; }
  table, td { border-collapse:collapse !important; mso-table-lspace:0pt !important; mso-table-rspace:0pt !important; }
  img { border:0; outline:none; text-decoration:none; -ms-interpolation-mode:bicubic; }
  a { color:inherit; }
  p, h1, h2, h3 { margin:0; padding:0; }
  body, table, td, a, p { -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%; }

  .font { font-family:'Lexend', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
  .shell { width:100%; max-width:600px; background:#F9FAF7; }
  .pad { padding-left:22px !important; padding-right:22px !important; }
  .heading { color:#11120F; }
  .text { color:#30312E; }
  .muted { color:#74766F; }
  .card { border-collapse:separate !important; border-spacing:0 !important; }
  .card-inner { background:#FFFFFF; border:1px solid #E1E3DD; border-radius:18px; }
  .soft { background:#F7F8F5; border:1px solid #E1E3DD; border-radius:16px; }
  .yellow { background:#FFF7D3; border:1px solid #EFD56A; border-radius:16px; }
  .rule { border-top:1px solid #E1E3DD; }
  .link { color:#2B16B7; text-decoration:underline; }
  .button { background:#151613; color:#FFFFFF; border-radius:12px; }
  .body-copy { font-size:16px; line-height:1.65; color:#30312E; }
  .section-title { font-size:20px; line-height:1.25; font-weight:700; color:#11120F; }
  .rounded-block { border-collapse:separate !important; border-spacing:0 !important; }

  @media screen and (min-width:601px) {
    .shell { border-radius:18px !important; }
    .pad { padding-left:36px !important; padding-right:36px !important; }
    .hero-title { font-size:38px !important; line-height:1.08 !important; }
    .outer-pad { padding:14px 0 !important; }
    .goal-cell-left { padding-right:7px !important; }
    .goal-cell-right { padding-left:7px !important; }
  }

  @media screen and (max-width:600px) {
    .outer-pad { padding:0 !important; }
    .hero-title { font-size:31px !important; line-height:1.12 !important; }
    .body-copy { font-size:16px !important; line-height:1.65 !important; }
    .section-title { font-size:20px !important; }
    .header-right { font-size:9px !important; }
    .goal-cell { display:block !important; width:100% !important; padding-left:0 !important; padding-right:0 !important; }
    .goal-gap { padding-top:12px !important; }
  }

  @media (prefers-color-scheme: dark) {
    body, .outer { background:#0E0F0D !important; }
    .shell { background:#151613 !important; }
    .card-inner { background:#1D1E1B !important; border-color:#343630 !important; }
    .soft { background:#272825 !important; border-color:#363832 !important; }
    .yellow { background:#342F16 !important; border-color:#66591C !important; }
    .heading, .text { color:#F3F4EF !important; }
    .muted { color:#A7A9A2 !important; }
    .rule { border-color:#343630 !important; }
    .link { color:#A9A2FF !important; }
    .button { background:#FFD007 !important; color:#11120F !important; }
    .logo-img { filter:brightness(0) invert(1); }
  }
</style>
