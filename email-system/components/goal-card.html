<!--
  Component: goal-card (single white card — use inside goal-grid-row)
  Placeholders:
    {{CHIP_LABEL}} — e.g. 01 Deep Focus
    {{BODY}} — card copy
-->
<table border="0" cellpadding="0" cellspacing="0" class="card rounded-block" height="100%" role="presentation" style="height:100%; border-collapse:separate; border-spacing:0;" width="100%">
  <tr>
    <td class="card-inner" style="padding:16px; background:#FFFFFF; border:1px solid #E1E3DD; border-radius:18px;" valign="top">
      <p class="font" style="font-size:10px; line-height:1; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:#11120F;">
        <span style="display:inline-block; background:#FFD007; padding:5px 8px; border-radius:6px; color:#11120F;">{{CHIP_LABEL}}</span>
      </p>
      <p class="font text" style="margin-top:12px; font-size:16px; line-height:1.65; color:#30312E;">
        {{BODY}}
      </p>
    </td>
  </tr>
</table>
