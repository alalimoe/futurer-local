<!--
  Component: goal-grid-row (two equal columns)
  Placeholders:
    {{LEFT_CARD_HTML}} — paste goal-card.html output
    {{RIGHT_CARD_HTML}} — paste goal-card.html output
  Optional: add class goal-gap on right cell for mobile stack spacing
-->
<tr>
  <td class="pad" style="padding-top:{{ROW_PADDING_TOP}}; padding-left:22px; padding-right:22px;">
    <table border="0" cellpadding="0" cellspacing="0" height="100%" role="presentation" style="height:100%;" width="100%">
      <tr>
        <td class="goal-cell goal-cell-left" height="100%" style="padding-right:6px; height:100%;" valign="top" width="50%">
          {{LEFT_CARD_HTML}}
        </td>
        <td class="goal-cell goal-cell-right goal-gap" height="100%" style="padding-left:6px; height:100%;" valign="top" width="50%">
          {{RIGHT_CARD_HTML}}
        </td>
      </tr>
    </table>
  </td>
</tr>
