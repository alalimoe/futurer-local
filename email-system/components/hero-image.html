<!--
  Component: hero-image (full-bleed within shell)
  Placeholders:
    {{IMAGE_URL}}
    {{IMAGE_ALT}}
    {{LINK_URL}} — optional wrap link (omit <a> if not linked)
-->
<tr>
  <td align="center" style="padding:20px 0 0 0; line-height:0; font-size:0;">
    <a href="{{LINK_URL}}" style="display:block; line-height:0; text-decoration:none;">
      <img alt="{{IMAGE_ALT}}" height="340" src="{{IMAGE_URL}}" style="display:block; width:100%; max-width:600px; height:auto; border:0;" width="600"/>
    </a>
  </td>
</tr>
