<!--
  Component: section-intro
  Placeholders:
    {{EYEBROW}} — chip label
    {{TITLE}} — h2 section title
    {{BODY_HTML}} — one or more <p> tags
-->
<tr>
  <td class="pad" style="padding-top:36px; padding-left:22px; padding-right:22px;">
    <p class="font" style="font-size:10px; line-height:1; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:#11120F;">
      <span style="display:inline-block; background:#FFD007; padding:6px 8px; border-radius:6px;">{{EYEBROW}}</span>
    </p>
    <h2 class="font heading section-title" style="margin-top:14px; font-size:20px; line-height:1.25; font-weight:700; color:#11120F;">
      {{TITLE}}
    </h2>
    {{BODY_HTML}}
  </td>
</tr>
