<!--
  Compound Identifier — email HTML fragment (Klaviyo / August calendar).
  Gold line matches existing #C79500 eyebrow. No JS. Lexend optional via email font stack.
  Usage: place under product name in product block.
-->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:8px 0 0 0;">
  <tr>
    <td style="font-family:'Lexend',Helvetica,Arial,sans-serif;font-size:11px;font-weight:300;letter-spacing:0.06em;line-height:1.4;color:#8F8B82;">
      {{ event.iupac_name }}
    </td>
  </tr>
  <tr>
    <td style="font-family:'Lexend',Helvetica,Arial,sans-serif;font-size:11px;font-weight:400;letter-spacing:0.14em;line-height:1.4;color:#C79500;padding-top:2px;">
      {{ event.formula_html }}
    </td>
  </tr>
</table>
